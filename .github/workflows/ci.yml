name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow builds and tests, it never writes back.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs: a tag can be moved, a SHA can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run content
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
